name: CI

on:
  push:
    paths-ignore: ['docs/**', '**/*.md', 'Designs/**']
  pull_request:
  workflow_dispatch:
    inputs:
      screenshots:
        description: "Also run the screenshot walk-through (slow; off by default)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-linux:
    name: Training engine tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v5
      - name: Test TrainingEngine
        run: swift test --package-path Packages/TrainingEngine

  ios:
    name: iOS app build & tests
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate

      # The generated project is committed so it can be opened in Xcode without
      # installing XcodeGen (Homebrew isn't available on the owner's Intel Mac).
      - name: Commit generated Xcode project
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Kinetix.xcodeproj Kinetix/Info.plist KinetixWidgets/Info.plist KinetixWatch/Info.plist
          if git diff --cached --quiet; then
            echo "Xcode project unchanged"
          else
            git commit -m "Update generated Xcode project"
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" \
              || echo "::warning::Couldn't push the generated Xcode project (a newer commit arrived); the next run will."
          fi
      - name: Test TrainingEngine (macOS)
        run: swift test --package-path Packages/TrainingEngine

      - name: Pick and boot simulator
        run: |
          UDID=$(./scripts/pick-simulator.sh)
          echo "Using simulator $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Build for testing
        run: |
          ./scripts/xcodebuild-step.sh build.log build-for-testing \
            -project Kinetix.xcodeproj -scheme Kinetix -destination "id=$UDID" \
            -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO

      - name: App unit tests
        run: |
          ./scripts/xcodebuild-step.sh unit-tests.log test-without-building \
            -project Kinetix.xcodeproj -scheme Kinetix -destination "id=$UDID" \
            -derivedDataPath DerivedData -only-testing:KinetixTests

      # Off by default (the owner tests builds through TestFlight). Run it by hand from
      # Actions → CI → Run workflow, ticking "screenshots".
      - name: Screenshots and screen recording
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots
        run: |
          mkdir -p screenshots
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force screenshots/walkthrough.mp4 &
          RECORDER=$!
          sleep 2
          TEST_RUNNER_SCREENSHOT_DIR="$PWD/screenshots" ./scripts/xcodebuild-step.sh ui-tests.log test-without-building \
            -project Kinetix.xcodeproj -scheme Kinetix -destination "id=$UDID" \
            -derivedDataPath DerivedData -only-testing:KinetixUITests -resultBundlePath UITests.xcresult \
            && status=0 || status=$?
          kill -INT $RECORDER || true
          wait $RECORDER || true
          # Fall back to the screenshots attached to the test results if none were written directly.
          if [ -z "$(ls screenshots/*.png 2>/dev/null)" ] && [ -d UITests.xcresult ]; then
            xcrun xcresulttool export attachments --path UITests.xcresult --output-path screenshots/attachments || true
          fi
          ls -la screenshots
          exit $status

      - name: Upload screenshots
        if: always() && github.event_name == 'workflow_dispatch' && inputs.screenshots
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: xcodebuild-logs
          path: '*.log'
          if-no-files-found: ignore

# XcodeGen project definition. Run `xcodegen` to (re)create Kinetix.xcodeproj.
# Edit this file rather than Xcode's project settings, so changes are kept in git.
name: Kinetix
options:
  bundleIdPrefix: com.georgeodwyer
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: en-GB
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  TrainingEngine:
    path: Packages/TrainingEngine
  # Garmin's Connect IQ companion SDK: talks to the Kinetix app on Garmin watches (garmin/).
  ConnectIQ:
    url: https://github.com/garmin/connectiq-companion-app-sdk-ios
    from: 1.8.0
targets:
  Kinetix:
    type: application
    platform: iOS
    sources:
      - path: Kinetix
      - path: Shared
    dependencies:
      - package: TrainingEngine
        product: TrainingEngine
      - package: TrainingEngine
        product: KinetixSync
      - package: ConnectIQ
        product: ConnectIQ
      - target: KinetixWidgets
      - target: KinetixWatch
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.georgeodwyer.kinetix
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGN_ENTITLEMENTS: Kinetix/Kinetix.entitlements
    info:
      path: Kinetix/Info.plist
      properties:
        CFBundleDisplayName: Kinetix
        # Version numbers come from the build settings (MARKETING_VERSION above; TestFlight sets the build number).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location, audio, bluetooth-central]
        NSLocationWhenInUseUsageDescription: "Kinetix uses your location during runs to measure distance and pace and draw your route, and to centre the map when you plan a route."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Kinetix keeps tracking your run with the screen locked so pace coaching and splits keep working."
        NSHealthShareUsageDescription: "Kinetix reads heart rate, resting heart rate, HRV, sleep, steps, active energy, VO2 max, breathing rate and workouts to show your body trends, judge recovery and balance your training load."
        NSHealthUpdateUsageDescription: "Kinetix saves your completed runs and strength sessions to Apple Health."
        NSBluetoothAlwaysUsageDescription: "Kinetix connects to Bluetooth heart rate straps to show live heart rate during workouts."
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        StravaClientID: $(STRAVA_CLIENT_ID)
        StravaClientSecret: $(STRAVA_CLIENT_SECRET)
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSPhotoLibraryAddUsageDescription: "Kinetix saves the run and workout cards you choose to your photo library."
        LSApplicationQueriesSchemes: [instagram-stories, gcm-ciq]
        InstagramAppID: $(INSTAGRAM_APP_ID)
        CFBundleURLTypes:
          - CFBundleURLName: com.georgeodwyer.kinetix
            CFBundleURLSchemes: [kinetix]
          - CFBundleURLName: com.georgeodwyer.kinetix.garmin
            CFBundleURLSchemes: [kinetix-ciq]
  KinetixWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: KinetixWidgets
      - path: Shared
      - path: Kinetix/DesignSystem/KXColor.swift
      - path: Kinetix/DesignSystem/KXFont.swift
      - path: Kinetix/DesignSystem/KXSpacing.swift
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.georgeodwyer.kinetix.widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: KinetixWidgets/KinetixWidgets.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        SKIP_INSTALL: YES
    info:
      path: KinetixWidgets/Info.plist
      properties:
        CFBundleDisplayName: Kinetix
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  # The Apple Watch app (runs on its own: GPS, heart rate and coaching without the iPhone).
  KinetixWatch:
    type: application
    platform: watchOS
    sources:
      - path: KinetixWatch
      - path: Kinetix/App/Formatters.swift
    dependencies:
      - package: TrainingEngine
        product: TrainingEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.georgeodwyer.kinetix.watchkitapp
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: KinetixWatch/KinetixWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
    info:
      path: KinetixWatch/Info.plist
      properties:
        CFBundleDisplayName: Kinetix
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.georgeodwyer.kinetix
        WKBackgroundModes: [workout-processing]
        UIBackgroundModes: [location]
        NSLocationWhenInUseUsageDescription: "Kinetix uses your watch's GPS during runs to measure distance and pace and draw your route."
        NSHealthShareUsageDescription: "Kinetix reads your heart rate during workouts to show it live and judge your effort."
        NSHealthUpdateUsageDescription: "Kinetix saves the runs you record on your watch to Apple Health."
  KinetixTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KinetixTests
    dependencies:
      - target: Kinetix
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  KinetixUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KinetixUITests
    dependencies:
      - target: Kinetix
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Kinetix
schemes:
  Kinetix:
    build:
      targets:
        Kinetix: all
        KinetixTests: [test]
        KinetixUITests: [test]
    test:
      targets:
        - KinetixTests
        - KinetixUITests
